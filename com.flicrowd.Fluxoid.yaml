id: com.flicrowd.Fluxoid
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: fluxoid

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: python3-pygame
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --prefix=${FLATPAK_DEST} pygame
    sources:
      - type: file
        url: https://pythonhosted.org
        sha256: d2cf6914b4369da97992c300dc964d8a14b09ff38cf6a8ec28a8818c35bbbb82

  - name: fluxoid
    buildsystem: simple
    build-commands:
      - install -d /app/bin /app/share/fluxoid
      - install -m 755 main.py /app/share/fluxoid/main.py
      - cp background.png background.mp3 game_over.wav win.wav /app/share/fluxoid/
      - echo -e '#!/bin/sh\npython3 /app/share/fluxoid/main.py "$@"' > /app/bin/fluxoid
      - chmod +x /app/bin/fluxoid
    sources:
      - type: dir
        path: .
