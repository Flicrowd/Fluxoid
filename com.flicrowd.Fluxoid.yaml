id: com.flicrowd.Fluxoid
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: fluxoid
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
modules:
  - name: python3-pygame-ce
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --prefix=${FLATPAK_DEST} pygame-ce
    sources:
      - type: file
        url: https://pythonhosted.org
        sha256: d187e145efb772b2264906f368f51a4f00db1070624bf05ccf10034fe2db0aa6
  - name: fluxoid
    buildsystem: simple
    build-commands:
      - install -d /app/bin /app/share/fluxoid
      - install -m 755 main.py /app/share/fluxoid/main.py
      - cp Fluxoid_Logo.png background.png background.mp3 track2.mp3 game_over.wav win.wav /app/share/fluxoid/
      - echo -e '#!/bin/sh\npython3 /app/share/fluxoid/main.py "$@"' > /app/bin/fluxoid
      - chmod +x /app/bin/fluxoid
    sources:
      - type: dir
        path: .
