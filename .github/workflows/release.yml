name: Build Universal Cross-Platform Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ruby and FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems gcc make rpm
          sudo gem install --no-document fpm

      - name: Prepare Package Directories
        run: |
          mkdir -p fluxoid-pkg/usr/local/bin
          mkdir -p fluxoid-pkg/usr/local/share/fluxoid
          cp main.py Fluxoid_Logo.png background.png background.mp3 track2.mp3 game_over.wav win.wav fluxoid-pkg/usr/local/share/fluxoid/
          echo -e '#!/bin/sh\npython3 /usr/local/share/fluxoid/main.py "$@"' > fluxoid-pkg/usr/local/bin/fluxoid
          chmod +x fluxoid-pkg/usr/local/bin/fluxoid

      - name: Compile DEB and RPM with Auto-Dependencies
        run: |
          fpm -s dir -t deb -n fluxoid -v 1.2.0 --depends python3 --depends python3-pygame -C fluxoid-pkg/ .
          fpm -s dir -t rpm -n fluxoid -v 1.2.0 --depends python3 --depends python3-pygame -C fluxoid-pkg/ .

      - name: Upload DEB & RPM to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.rpm

  build-flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flatpak-builder
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: fluxoid.flatpak
          manifest-path: com.flicrowd.Fluxoid.yaml
          run-tests: false

      - name: Upload Flatpak to Release
        uses: softprops/action-gh-release@v2
        with:
          files: fluxoid.flatpak

  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller & Pygame-ce
        run: |
          pip install pyinstaller pygame-ce

      - name: Build App Bundle via PyInstaller
        run: |
          pyinstaller --windowed --onefile --name=Fluxoid --add-data "background.png:." --add-data "background.mp3:." --add-data "track2.mp3:." --add-data "game_over.wav:." --add-data "win.wav:." --add-data "Fluxoid_Logo.png:." main.py

      - name: Create DMG Disk Image
        run: |
          npm install -g create-dmg
          create-dmg dist/Fluxoid.app || true
          mv *.dmg Fluxoid_macOS.dmg || true

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          files: fluxoid_macOS.dmg
